<!-- 問１：段落と改行を使って、次の文章をHTMLに書き直してください。-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <p>
            HTMLの学習は楽しいです。<br>
            わからない箇所は質問しましょう。<br>

        </p>
    </div>
</body>
</html>
